- id: DOC4
  method: GET
  path: /v1/me/documents/{document_id}/content
  authenticated: true
  idempotent: false
  binary: true
  summary: Download the verified document bytes. The complete bounded buffer is SHA-256
    verified BEFORE any HTTP status/headers/body are sent.
  request:
    path_params:
    - document_id
  responses:
  - status: 200
    description: Verified bytes; attachment; nosniff; CSP default-src 'none'.
    media_types:
    - application/pdf
    - image/png
    - image/jpeg
  - status: 404
    codes:
    - document_not_found
    description: Not found / not owned.
  - status: 409
    codes:
    - document_integrity_mismatch
    description: Stored digest mismatch; zero document bytes sent.
  - status: 401
    codes:
    - authentication_required
    - invalid_session
    description: Unauthenticated.
  - status: 403
    codes:
    - forbidden
    - admin_clinical_content_forbidden
    description: Wrong role.
  - status: 500
    codes:
    - internal_error
    description: Unexpected failure.
