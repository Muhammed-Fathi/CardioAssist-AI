# Term 1 · C1 contract source — paths (patient enrollment, assignments, consent)
# Valid machine-readable YAML.
status: "PROPOSED — NOT APPROVED, NOT DEPLOYED"
server: "/v1"
content_type: "application/json"
contract_version: "v1"
synthetic_data_only: true
description: |
  Patient registration via invitation, linking an existing patient to a doctor,
  assignment listing, single-assignment revocation (doctor and patient sides),
  and patient-wide synthetic-demo consent revocation.

  SYNTHETIC DEMO DATA ONLY. Real email domains, real names, phone numbers,
  addresses and national identifiers are rejected.
cross_cutting_rules:
  authentication: "Authorization: Bearer <session_token> where bearer required; never accepted in a body, query or cookie"
  idempotency: "Exactly one Idempotency-Key request header on every mutating operation listed in IDEMPOTENT_C1"
operations:
  - id: E1
    method: POST
    path: /v1/patients/register
    authenticated: false
    idempotent: true
    summary: "Anonymous atomic patient registration against a live invitation."
    request:
      fields: [access_code, identifier, email, password, consent_ack]
      body: required
      request_schema: term1_patient_register_request.schema.json
    responses:
      - status: 201
        description: "{user_id, patient_id, assignment_id, session_id, session_token once, expires_at, subject_label, contract_version}"
        response_schema: term1_patient_register_response.schema.json
      - status: 400
        codes: [malformed_request, idempotency_key_required]
        description: "Malformed body, wrong Content-Type, or a missing/ambiguous Idempotency-Key"
      - status: 401
        codes: [invalid_invitation]
        description: "Unauthenticated, invalid session, or a deliberately generic authentication/invitation failure"
      - status: 403
        codes: [forbidden, identity_key_change_unsupported]
        description: "Authenticated but wrong role, password_change_required, or an unsupported key-id change"
      - status: 409
        codes: [idempotency_key_conflict, idempotency_scope_conflict, secret_not_redisclosable, subject_identity_conflict, account_registration_unavailable, identity_key_material_mismatch, identity_key_replacement_unsupported]
        description: "Idempotency, identity-key or domain-state conflict"
      - status: 422
        codes: [validation_failed, password_policy_violation, invalid_demo_identifier]
        description: "Semantically complete but inadmissible values"
      - status: 429
        codes: [rate_limited]
        description: "Lockout; Retry-After is present"
      - status: 500
        codes: [internal_error]
        description: "Unexpected failure; no internal detail is disclosed"
      - status: 503
        codes: [identity_key_configuration_error]
        description: "Operator identity key material is not configured correctly for this database"
  - id: E2
    method: POST
    path: /v1/patients/link
    authenticated: true
    idempotent: true
    summary: "Attach an existing patient to the inviting doctor; creates one ACTIVE assignment."
    request:
      fields: [access_code, identifier, accept_linking]
      body: required
      request_schema: term1_patient_link_request.schema.json
    responses:
      - status: 200
        description: "{assignment_id, doctor_label, patient_id, contract_version}"
        response_schema: term1_patient_link_response.schema.json
      - status: 400
        codes: [malformed_request, idempotency_key_required]
        description: "Malformed body, wrong Content-Type, or a missing/ambiguous Idempotency-Key"
      - status: 401
        codes: [authentication_required, invalid_session, invalid_invitation]
        description: "Unauthenticated, invalid session, or a deliberately generic authentication/invitation failure"
      - status: 403
        codes: [forbidden, password_change_required, identity_key_change_unsupported]
        description: "Authenticated but wrong role, password_change_required, or an unsupported key-id change"
      - status: 409
        codes: [idempotency_key_conflict, idempotency_scope_conflict, role_profile_mismatch, identity_key_material_mismatch, identity_key_replacement_unsupported]
        description: "Idempotency, identity-key or domain-state conflict"
      - status: 422
        codes: [validation_failed, invalid_demo_identifier]
        description: "Semantically complete but inadmissible values"
      - status: 429
        codes: [rate_limited]
        description: "Lockout; Retry-After is present"
      - status: 500
        codes: [internal_error]
        description: "Unexpected failure; no internal detail is disclosed"
      - status: 503
        codes: [identity_key_configuration_error]
        description: "Operator identity key material is not configured correctly for this database"
  - id: E3
    method: GET
    path: /v1/me/assignments
    authenticated: true
    idempotent: false
    summary: "List the caller's own active assignments (PATIENT only)."
    request:
      body: absent
    responses:
      - status: 200
        description: "{assignments: [{assignment_id, doctor_label, assigned_at, consent_active}], contract_version}"
        response_schema: term1_me_assignments_response.schema.json
      - status: 401
        codes: [authentication_required, invalid_session]
        description: "Unauthenticated, invalid session, or a deliberately generic authentication/invitation failure"
      - status: 403
        codes: [forbidden, password_change_required, role_profile_mismatch]
        description: "Authenticated but wrong role, password_change_required, or an unsupported key-id change"
      - status: 500
        codes: [internal_error]
        description: "Unexpected failure; no internal detail is disclosed"
      - status: 503
        codes: [identity_key_configuration_error]
        description: "Operator identity key material is not configured correctly for this database"
  - id: E4
    method: POST
    path: /v1/doctor/assignments/{assignment_id}/revoke
    authenticated: true
    idempotent: true
    summary: "Doctor revokes an assignment it owns; affects only that doctor-patient pair."
    path_parameters: [assignment_id]
    request:
      fields: [reason_code]
      body: required
      request_schema: term1_assignment_doctor_revoke_request.schema.json
    responses:
      - status: 200
        description: "{assignment_id, revoked_at, contract_version}"
        response_schema: term1_assignment_doctor_revoke_response.schema.json
      - status: 400
        codes: [malformed_request, idempotency_key_required]
        description: "Malformed body, wrong Content-Type, or a missing/ambiguous Idempotency-Key"
      - status: 401
        codes: [authentication_required, invalid_session]
        description: "Unauthenticated, invalid session, or a deliberately generic authentication/invitation failure"
      - status: 403
        codes: [forbidden, password_change_required, role_profile_mismatch]
        description: "Authenticated but wrong role, password_change_required, or an unsupported key-id change"
      - status: 404
        codes: [assignment_not_found]
        description: "Not found, or not owned by the caller (identical shape; no IDOR oracle)"
      - status: 409
        codes: [idempotency_key_conflict, idempotency_scope_conflict, assignment_already_revoked, identity_key_material_mismatch, identity_key_replacement_unsupported]
        description: "Idempotency, identity-key or domain-state conflict"
      - status: 422
        codes: [validation_failed]
        description: "Semantically complete but inadmissible values"
      - status: 500
        codes: [internal_error]
        description: "Unexpected failure; no internal detail is disclosed"
      - status: 503
        codes: [identity_key_configuration_error]
        description: "Operator identity key material is not configured correctly for this database"
  - id: E5
    method: POST
    path: /v1/me/assignments/{assignment_id}/revoke
    authenticated: true
    idempotent: true
    summary: "Patient revokes a single assignment it owns."
    path_parameters: [assignment_id]
    request:
      fields: [reason_code]
      body: required
      request_schema: term1_assignment_patient_revoke_request.schema.json
    responses:
      - status: 200
        description: "{assignment_id, revoked_at, contract_version}"
        response_schema: term1_assignment_patient_revoke_response.schema.json
      - status: 400
        codes: [malformed_request, idempotency_key_required]
        description: "Malformed body, wrong Content-Type, or a missing/ambiguous Idempotency-Key"
      - status: 401
        codes: [authentication_required, invalid_session]
        description: "Unauthenticated, invalid session, or a deliberately generic authentication/invitation failure"
      - status: 403
        codes: [forbidden, password_change_required, role_profile_mismatch]
        description: "Authenticated but wrong role, password_change_required, or an unsupported key-id change"
      - status: 404
        codes: [assignment_not_found]
        description: "Not found, or not owned by the caller (identical shape; no IDOR oracle)"
      - status: 409
        codes: [idempotency_key_conflict, idempotency_scope_conflict, assignment_already_revoked, identity_key_material_mismatch, identity_key_replacement_unsupported]
        description: "Idempotency, identity-key or domain-state conflict"
      - status: 422
        codes: [validation_failed]
        description: "Semantically complete but inadmissible values"
      - status: 429
        codes: [rate_limited]
        description: "Lockout; Retry-After is present"
      - status: 500
        codes: [internal_error]
        description: "Unexpected failure; no internal detail is disclosed"
      - status: 503
        codes: [identity_key_configuration_error]
        description: "Operator identity key material is not configured correctly for this database"
  - id: E6
    method: POST
    path: /v1/me/consent/synthetic-demo/revoke
    authenticated: true
    idempotent: true
    summary: "Withdraw the patient-wide synthetic-demo consent (checked again at inference completion)."
    request:
      fields: [reason_code]
      body: required
      request_schema: term1_consent_revoke_request.schema.json
    responses:
      - status: 200
        description: "{consent_id, revoked_at, contract_version}"
        response_schema: term1_consent_revoke_response.schema.json
      - status: 400
        codes: [malformed_request, idempotency_key_required]
        description: "Malformed body, wrong Content-Type, or a missing/ambiguous Idempotency-Key"
      - status: 401
        codes: [authentication_required, invalid_session]
        description: "Unauthenticated, invalid session, or a deliberately generic authentication/invitation failure"
      - status: 403
        codes: [forbidden, password_change_required, role_profile_mismatch]
        description: "Authenticated but wrong role, password_change_required, or an unsupported key-id change"
      - status: 404
        codes: [consent_not_found]
        description: "Not found, or not owned by the caller (identical shape; no IDOR oracle)"
      - status: 409
        codes: [idempotency_key_conflict, idempotency_scope_conflict, identity_key_material_mismatch, identity_key_replacement_unsupported]
        description: "Idempotency, identity-key or domain-state conflict"
      - status: 422
        codes: [validation_failed]
        description: "Semantically complete but inadmissible values"
      - status: 500
        codes: [internal_error]
        description: "Unexpected failure; no internal detail is disclosed"
      - status: 503
        codes: [identity_key_configuration_error]
        description: "Operator identity key material is not configured correctly for this database"
