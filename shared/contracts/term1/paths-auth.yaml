# Term 1 · C1 contract source — paths (authentication and sessions)
# Valid machine-readable YAML. The `description` fields carry the human-readable
# narrative; `operations` is the structured inventory consumed by contract tests.
status: "PROPOSED — NOT APPROVED, NOT DEPLOYED"
server: "/v1"
content_type: "application/json"
contract_version: "v1"
synthetic_data_only: true
patient_score_display_authorized: false
description: |
  Modular source for the C1 slice of the single canonical served OpenAPI document.
  The legacy `shared/contracts/openapi.yaml` stays byte-for-byte unchanged; this
  file is composed with the other `paths-*.yaml` modules and `schemas/*.json`.

  SYNTHETIC / DEMO DATA ONLY. No real patient data, no clinical output, no
  diagnosis. Patient score display is NOT AUTHORIZED (Decision B pending).

cross_cutting_rules:
  authentication: "Authorization: Bearer <session_token>; the token value is never accepted in a body, query or cookie"
  idempotency: "Exactly one Idempotency-Key request header on every mutating operation listed in IDEMPOTENT_C1; no body field substitutes for it"
  replay_identity: "(replay_scope, key_hash, actor_binding, operation, target_ref); a match with identical keyed fingerprints returns the stored response with idempotent_replay: true"
  replay_conflict: "Same key, different operation or target → 409 idempotency_scope_conflict; same key, different payload/secret fingerprint → 409 idempotency_key_conflict"
  secret_non_disclosure: "A response that ever contained a one-time secret (session_token, access_code, temp_secret) is never replayed: 409 secret_not_redisclosable with non-secret identifiers only"
  session_lifetime: "8 h absolute, 30 min idle; refresh rotates the token and revokes the previous session"
  lockout: "5 failed logins per account/source bucket → 429 rate_limited with Retry-After; anonymous enrollment attempts are counted per invitation"
  errors: '{"contract_version": "v1", "error": {"code", "message"}} with static messages; codes are closed (errors.yaml)'
  caching: "Every C1 response is Cache-Control: no-store"
operations:
  - id: A1
    method: POST
    path: /v1/auth/login
    authenticated: false
    idempotent: false
    summary: "Authenticate with email and password; issue a one-time session token."
    request:
      fields: [email, password]
      body: required
      request_schema: term1_auth_login_request.schema.json
    responses:
      - status: 200
        description: Success
        body: "{session_token once, expires_at, role, user_id, profile_id, password_change_required, session_id, contract_version}"
        response_schema: term1_auth_login_response.schema.json
      - status: 401
        code: invalid_credentials
        description: "Wrong credentials, unknown account, SUSPENDED, DISABLED (identical shape; no account existence oracle)"
      - status: 429
        code: rate_limited
        description: Lockout + Retry-After
      - status: 400
        code: malformed_request
        description: Malformed
  - id: A2
    method: POST
    path: /v1/auth/logout
    authenticated: true
    idempotent: false
    summary: "Revoke the presented session; empty or absent body accepted."
    request:
      fields: []
      body: optional
      note: "empty or absent body accepted"
    responses:
      - status: 200
        description: "{revoked_at, contract_version}"
        response_schema: term1_auth_logout_response.schema.json
      - status: 401
        code: invalid_session
        description: "Second call with same token is 401 (session already gone); never resurrects it"
      - status: 400
        code: malformed_request
  - id: A3
    method: GET
    path: /v1/auth/me
    authenticated: true
    idempotent: false
    summary: "Return the caller's profile; never a token, verifier or hash."
    request:
      body: absent
    responses:
      - status: 200
        description: "{user_id, role, profile_id, email, display_name, status, password_change_required, contract_version}"
        response_schema: term1_auth_me_response.schema.json
      - status: 401
        code: authentication_required
  - id: A4
    method: POST
    path: /v1/auth/refresh
    authenticated: true
    idempotent: false
    summary: "Rotate the current session atomically: revoke the presented session and return exactly one new session."
    request:
      fields: []
      body: optional
      note: "empty or absent body accepted"
    responses:
      - status: 200
        description: Success (one new session, previous revoked)
        response_schema: term1_auth_refresh_response.schema.json
      - status: 401
        code: invalid_session
        description: "Revoked, expired or idle-expired token; creates no session"
      - status: 400
        code: malformed_request
  - id: A5
    method: POST
    path: /v1/me/password
    authenticated: true
    idempotent: false
    summary: "Change password; revoke every other session of the account."
    request:
      fields: [current_password, new_password]
      body: required
      request_schema: term1_me_password_request.schema.json
    responses:
      - status: 200
        description: "{changed_at, revoked_other_sessions, contract_version}"
        response_schema: term1_me_password_response.schema.json
      - status: 401
        code: invalid_credentials
        description: Wrong current password
      - status: 403
        code: password_change_required
      - status: 422
        code: password_unchanged
        description: "New value equals current"
      - status: 422
        code: password_policy_violation
        description: "Outside 12–128 UTF-8 bytes or containing control characters"
      - status: 400
        code: malformed_request
  - id: A6
    method: GET
    path: /v1/me/sessions
    authenticated: true
    idempotent: false
    summary: "Return only the caller's own sessions."
    request:
      body: absent
    responses:
      - status: 200
        description: "{sessions: [{session_id, created_at, last_seen_at, expires_at, revoked_at, current}], contract_version}"
        response_schema: term1_me_sessions_response.schema.json
      - status: 401
        code: authentication_required
  - id: A7
    method: DELETE
    path: /v1/me/sessions/{session_id}
    authenticated: true
    idempotent: false
    summary: "Revoke one own session; cross-account session id → 404 not_found (identical to nonexistent id)."
    request:
      body: absent
    responses:
      - status: 200
        description: "{session_id, revoked_at, contract_version}"
        response_schema: term1_auth_session_revoke_response.schema.json
      - status: 401
        code: authentication_required
      - status: 404
        code: not_found
        description: "Another account's session id or nonexistent id; no enumeration oracle"
      - status: 400
        code: malformed_request
