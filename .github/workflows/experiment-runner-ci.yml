name: synthetic-experiment-runner-validation

# M2c/M2a/M3a tests are synthetic-only. This workflow never invokes preflight/run,
# never accesses data/, and never consumes a real Cleveland, UCI-411 or UCI-412
# source file. Each dry-run fits only generated in-memory fixtures on the hosted
# CI CPU. M3a UCI-412 execution is Windows-local and human-authorized only.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-experiment-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-runner-tests:
    name: Synthetic experiment runner (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned local-runner dependencies
        run: |
          python -m pip install -r research/experiments/requirements.txt
          python -m pip install -r research/audit/requirements.txt
          python -m pip install -r research/uci412/requirements.txt
          python -m pip check

      - name: Run synthetic experiment-runner and dataset-audit tests
        run: |
          python -m pytest tests/experiments tests/audit -q -W error

      # Only after a failing synthetic suite: report safe field names, mismatch
      # categories and numeric deltas, never synthetic scores, keys, or paths.
      # The original failing pytest step remains a hard CI failure. Do not
      # relax the golden fixture, its hash, or any numeric acceptance tolerance.
      - name: Diagnose RH-04 fixture drift on Python 3.12 (read-only, redacted)
        if: ${{ failure() && matrix.python-version == '3.12' }}
        run: |
          python -m research.intake.diagnose_fixture_replay

      - name: Run synthetic UCI-412 benchmark tests
        run: |
          python -m pytest tests/uci412 -q -W error

      - name: Execute the registered synthetic-only dry-run
        run: |
          python -m research.experiments dry-run

      - name: Describe the proposed (unauthorized) UCI-412 protocol
        run: |
          python -m research.uci412 describe

      - name: Execute the registered UCI-412 synthetic-only dry-run
        run: |
          python -m research.uci412 dry-run

      - name: Verify source-material integrity
        run: |
          python scripts/verify_sources.py

      - name: Reject real datasets or generated artifacts in the checkout
        shell: bash
        run: |
          set -euo pipefail

          if [ -d data ] && find data -mindepth 1 -print -quit | grep -q .; then
            echo "ERROR: This synthetic-only job must not contain any /data/ files." >&2
            exit 1
          fi

          if find research/experiments research/audit research/uci412 \
            tests/experiments tests/audit tests/uci412 -type f \
            \( -name '*.data' -o -name '*.dat' -o -name '*.csv' -o -name '*.parquet' \
            -o -name '*.feather' -o -name '*.pkl' -o -name '*.joblib' \
            -o -name '*.pt' -o -name '*.pth' -o -name '*.onnx' -o -name '*.h5' \
            -o -name '*.sqlite' -o -name '*.sqlite3' -o -name '*.db' \
            -o -name '*.xlsx' -o -name '*.xls' \) \
            -print -quit | grep -q .; then
            echo "ERROR: Prohibited dataset or experiment artifact found in source/tests." >&2
            exit 1
          fi

          echo "PASS: No real datasets or generated patient-level artifacts were present."

  rh04-fixture-diagnostic:
    name: RH-04 fixture structural drift diagnostic (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out synthetic-only source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install exactly the same pinned synthetic-runner dependencies
        run: |
          python -m pip install -r research/experiments/requirements.txt
          python -m pip install -r research/audit/requirements.txt
          python -m pip install -r research/uci412/requirements.txt
          python -m pip check

      - name: Inspect canonical 29-case synthetic replay (metadata only)
        run: |
          python -m research.intake.diagnose_fixture_replay
