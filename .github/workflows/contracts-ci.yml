
name: contract-validation

# CardioAssist AI — Phase 1 / M1a.1
# Validate API contracts and deterministic MOCK fixtures.
#
# No real patient data, datasets, trained AI models,
# databases, cloud services, or paid resources required.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimum required GitHub token permissions
permissions:
  contents: read

# Cancel outdated runs for the same PR
concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Contract and fixture validation

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:

      # 1. Checkout repository
      # actions/checkout v7.0.0 — Node.js 24
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # 2. Setup Python
      # actions/setup-python v7.0.0 — Node.js 24
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      # 3. Install pinned dependencies
      - name: Install contract-test dependencies
        run: |
          python -m pip install -r tests/contracts/requirements.txt

      # 4. Validate OpenAPI, schemas and mock fixtures
      - name: Validate API contracts and mock fixtures
        run: |
          python -m pytest tests/contracts -q

      # 5. Reject prohibited file types
      # This is NOT a full secrets or PHI scanner.
      - name: Check for prohibited files
        shell: bash
        run: |
          set -euo pipefail

          if find shared/contracts tests/contracts -type f \
            \( -name '*.pkl' \
            -o -name '*.joblib' \
            -o -name '*.pt' \
            -o -name '*.pth' \
            -o -name '*.onnx' \
            -o -name '*.h5' \
            -o -name '*.parquet' \
            -o -name '*.csv' \
            -o -name '*.sqlite' \
            -o -name '*.db' \
            -o -name '*.p12' \
            -o -name '*.pem' \
            -o -name '*.key' \
            -o -name '.env' \
            -o -name '.env.*' \) | grep -q .; then

            echo "ERROR: Prohibited file found." >&2
            exit 1
          fi

          echo "PASS: No prohibited file extensions found."
