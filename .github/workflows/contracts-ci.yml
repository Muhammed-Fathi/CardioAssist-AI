
name: contract-validation

# M1a.1: Validate versioned API contracts and synthetic fixtures.
# No real datasets, trained models, or patient records are used.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Contract and fixture validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned contract-test dependencies
        run: |
          python -m pip install -r tests/contracts/requirements.txt

      - name: Validate OpenAPI schemas and synthetic fixtures
        run: |
          python -m pytest tests/contracts -q

      - name: Reject prohibited file extensions
        shell: bash
        run: |
          set -euo pipefail

          if find shared/contracts tests/contracts -type f \
            \( -name '*.pkl' \
            -o -name '*.joblib' \
            -o -name '*.pt' \
            -o -name '*.pth' \
            -o -name '*.onnx' \
            -o -name '*.h5' \
            -o -name '*.parquet' \
            -o -name '*.csv' \
            -o -name '*.sqlite' \
            -o -name '*.db' \
            -o -name '*.p12' \
            -o -name '*.pem' \
            -o -name '*.key' \
            -o -name '.env' \
            -o -name '.env.*' \) | grep -q .; then

            echo "Prohibited file extension found." >&2
            exit 1
          fi

          echo "OK: no prohibited file extensions found."
