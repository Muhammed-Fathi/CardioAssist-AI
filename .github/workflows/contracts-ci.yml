name: contract-validation

# M1a.1 (D-043): validate the PROPOSED /v1 API contract and the deterministic
# MOCK / SYNTHETIC fixture pack on every pull request.
#
# Cost: $0. The job is pure-Python, CPU only, needs no model artifact, no
# dataset, no database, no cloud service and no account. A run takes well under
# a minute, so it stays far inside the free GitHub Actions minutes included
# with every plan.
#
# Scope note: this workflow validates CONTRACTS ONLY. It does not build, serve
# or test an application, and it must never be extended to download datasets or
# model artifacts.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Contract + fixture validation (M1a.1)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Install the pinned contract-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/contracts/requirements.txt

      - name: Validate the OpenAPI document, the schemas and the mock fixtures
        run: python -m pytest tests/contracts -q

      - name: Confirm no dataset, model artifact or secret was committed
        run: |
          set -euo pipefail
          # The contract package must stay text-only and free of anything that
          # could carry patient data or a model artifact.
          if find shared/contracts tests/contracts -type f \
               \( -name '*.pkl' -o -name '*.joblib' -o -name '*.pt' -o -name '*.pth' \
                  -o -name '*.onnx' -o -name '*.h5' -o -name '*.parquet' -o -name '*.csv' \
                  -o -name '*.sqlite' -o -name '*.db' -o -name '*.p12' -o -name '*.pem' \
                  -o -name '*.key' -o -name '.env' \) | grep -q .; then
            echo "Unexpected binary, dataset, artifact or credential file in the contract package." >&2
            exit 1
          fi
          echo "OK: no dataset, model artifact or credential file in the contract package."
