name: audit-toolchain-validation

# CardioAssist AI — M2a
#
# Validate the read-only local dataset audit toolchain (research/audit/)
# and its synthetic fixture unit and negative test suite (tests/audit/).
#
# Tests use synthetic software fixtures only.
# No clinical datasets, patient-level data, trained AI models, or paid services.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimum GitHub token permissions
permissions:
  contents: read

concurrency:
  group: audit-toolchain-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-tests:
    name: Dataset audit toolchain (Python ${{ matrix.python-version }})

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      # Official actions pinned to immutable commit SHAs
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned audit dependencies
        run: |
          python -m pip install -r research/audit/requirements.txt
          python -m pip check

      - name: Run synthetic dataset audit unit and negative tests
        run: |
          python -m pytest tests/audit -q -W error

      - name: Run audit CLI preflight and synthetic self-test checks
        run: |
          python -m research.audit check-auth
          python -m research.audit verify-ignore
          python -m research.audit dry-run
          python -m research.audit self-test

      - name: Verify original source integrity
        run: |
          python scripts/verify_sources.py

      - name: Reject prohibited research/audit and dataset artifacts
        shell: bash
        run: |
          set -euo pipefail

          if [ -d data ] && find data -mindepth 1 -print -quit | grep -q .; then
            echo "ERROR: Prohibited file or directory found under /data/." >&2
            exit 1
          fi

          if find research/audit tests/audit -type f \
            \( -name '*.pkl' \
            -o -name '*.joblib' \
            -o -name '*.pt' \
            -o -name '*.pth' \
            -o -name '*.onnx' \
            -o -name '*.h5' \
            -o -name '*.parquet' \
            -o -name '*.csv' \
            -o -name '*.xlsx' \
            -o -name '*.xls' \
            -o -name '*.data' \
            -o -name '*.dat' \
            -o -name '*.sqlite' \
            -o -name '*.sqlite3' \
            -o -name '*.db' \
            -o -name '*.p12' \
            -o -name '*.pem' \
            -o -name '*.key' \
            -o -name '.env' \
            -o -name '.env.*' \) \
            -print -quit | grep -q .; then

            echo "ERROR: Prohibited artifact or dataset file found." >&2
            exit 1
          fi

          echo "PASS: No prohibited research/audit artifact or dataset extensions found."
          # Extension guard only: not a PHI or secrets scanner.
